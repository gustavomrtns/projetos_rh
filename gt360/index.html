<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT 360° — Workspace de Gestão de Talentos</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --g1a:#f7a800;--g1b:#ff4e00;--g2a:#0099e5;--g2b:#00e5a0;--g3a:#7b2ff7;--g3b:#e0009e;
  --grad1:linear-gradient(160deg,var(--g1a),var(--g1b));
  --grad2:linear-gradient(160deg,var(--g2a),var(--g2b));
  --grad3:linear-gradient(160deg,var(--g3a),var(--g3b));
  --gradFull:linear-gradient(135deg,#f7a800 0%,#ff4e00 20%,#e0009e 40%,#7b2ff7 60%,#0099e5 80%,#00e5a0 100%);
  --grad4:linear-gradient(160deg,#00c48c,#0099e5);
  --white:#fff;--offwhite:#f8f9fc;
  --gray50:#f4f5f8;--gray100:#e8eaf0;--gray200:#d0d4e0;
  --gray400:#9098b0;--gray600:#5a6278;--gray800:#2a2f42;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 28px rgba(20,20,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--offwhite);color:var(--gray800);font-family:'Sora',sans-serif;display:flex;flex-direction:column;overflow:hidden}

.brand-band{height:5px;background:var(--gradFull);flex-shrink:0}

header{background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:12px 24px;flex-shrink:0;position:relative;z-index:50}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-wrap img{height:44px;width:auto;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text .name{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:.02em;color:var(--gray800)}
.brand-text .tag{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--gray400);font-weight:600;margin-top:2px}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.header-actions button{padding:9px 12px;border:1px solid var(--gray200);border-radius:9px;background:var(--white);color:var(--gray800);font:600 11px 'Sora',sans-serif;cursor:pointer}
.header-actions button:hover{border-color:var(--g2a)}
.header-actions button:focus-visible{outline:3px solid var(--g2a);outline-offset:2px}
.backup-status{font-size:11px;color:var(--gray600)}

/* WORKSPACE BODY (sidebar + conteudo) */
.workspace-body{flex:1;display:flex;overflow:hidden;min-height:0}

.sidebar{width:248px;flex-shrink:0;background:var(--white);border-right:1px solid var(--gray100);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow-y:auto;overflow-x:hidden;transition:width .2s ease}
.sidebar.collapsed{width:76px}
.sidebar.collapsed .sidebar-label{display:none}
.sidebar.collapsed .side-item{justify-content:center;padding:12px 8px}
.sidebar.collapsed .side-item .label{display:none}
.sidebar.collapsed .side-toggle{justify-content:center}
.sidebar.collapsed .side-toggle .chevron{transform:rotate(180deg)}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gray400);padding:6px 12px 10px}
.side-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--gray600);transition:all .18s;border:2px solid transparent;background:none;text-align:left;width:100%;font-family:'Sora',sans-serif}
.side-item:hover{background:var(--gray50);color:var(--gray800)}
.side-item:focus-visible,.side-toggle:focus-visible,.btn-acessar:focus-visible{outline:3px solid var(--g2a);outline-offset:2px}
.side-item.active{background:var(--gray800);border-color:var(--gray800);color:var(--white)}
.side-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.side-item .dot.dhome{background:var(--gray800)}
.side-item .dot.d1{background:var(--grad1)}
.side-item .dot.d2{background:var(--grad2)}
.side-item .dot.d3{background:var(--grad3)}
.side-item .dot.d4{background:var(--grad4)}
.side-item.active .dot{box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.sidebar-sep{height:1px;background:var(--gray100);margin:10px 8px}
.side-toggle{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:100%;padding:12px 14px;border-radius:10px;border:none;background:none;cursor:pointer;color:var(--gray400);font-family:'Sora',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:background .18s,color .18s}
.side-toggle:hover{background:var(--gray50);color:var(--gray800)}
.side-toggle .chevron{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:6px solid currentColor;flex-shrink:0;transition:transform .2s}
.sidebar.collapsed .side-toggle .label{display:none}

/* CONTEUDO */
.content{flex:1;position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.view.active{opacity:1;pointer-events:auto}
iframe.view{width:100%;height:100%;border:0;background:var(--white)}

.boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--gray400);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;z-index:40;background:var(--offwhite)}
.boot img{height:56px;opacity:.5}

/* HOME */
.home-view{overflow-y:auto;background:var(--offwhite)}
.home-inner{max-width:1180px;margin:0 auto;padding:14px 24px 16px}
.home-inner h1{font-family:'DM Serif Display',serif;font-size:19px;color:var(--gray800);margin-bottom:2px}
.home-inner>p{font-size:12px;color:var(--gray400);margin-bottom:12px;max-width:560px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.home-group{margin-bottom:11px}
.home-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gray400);margin-bottom:6px}
.home-card{background:var(--white);border-radius:var(--radius,12px);box-shadow:var(--shadow);padding:11px 14px;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.home-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.home-card-band{position:absolute;top:0;left:0;right:0;height:4px}
.home-card-band.d1{background:var(--grad1)}
.home-card-band.d2{background:var(--grad2)}
.home-card-band.d3{background:var(--grad3)}
.home-card-band.d4{background:var(--grad4)}
.home-card-dot{width:26px;height:26px;border-radius:8px;margin:4px 0 8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
.home-card-dot.d1{background:var(--grad1)}
.home-card-dot.d2{background:var(--grad2)}
.home-card-dot.d3{background:var(--grad3)}
.home-card-dot.d4{background:var(--grad4)}
.home-card h3{font-size:13px;font-weight:700;color:var(--gray800);margin-bottom:4px;line-height:1.3}
.home-card p{font-size:11px;color:var(--gray400);line-height:1.4;margin-bottom:10px;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-acessar{align-self:flex-start;padding:7px 14px;border-radius:8px;border:none;background:var(--grad2);color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:11px;cursor:pointer;transition:opacity .2s,transform .2s}
.btn-acessar.d1{background:var(--grad1)}
.btn-acessar.d2{background:var(--grad2)}
.btn-acessar.d3{background:var(--grad3)}
.btn-acessar.d4{background:var(--grad4)}
.btn-acessar:hover{opacity:.9;transform:translateY(-1px)}
.home-empty{color:var(--gray400);font-size:13px;padding:24px;text-align:center}
.mobile-nav-hint{display:none}

@media (max-width:780px){
  header{padding:10px 14px;gap:10px;flex-wrap:wrap}
  .header-actions{width:100%;margin-left:0;flex-wrap:wrap}
  .brand-text .name{font-size:16px}
  .brand-text .tag{display:none}
  .workspace-body{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--gray100);padding:8px 10px;gap:6px}
  #sidebar-nav{display:flex;gap:6px;width:max-content}
  .mobile-nav-hint{display:block;padding:8px 14px 0;background:var(--white);color:var(--gray600);font-size:11px}
  .sidebar-label{display:none}
  .sidebar-sep{display:none}
  .side-item{width:auto;flex-shrink:0;white-space:nowrap}
  .side-toggle{display:none}
  .sidebar.collapsed{width:100%}
  .home-inner{padding:32px 16px 40px}
  .home-inner h1{font-size:24px}
}
</style>
</head>
<body>

<div class="brand-band"></div>
<header>
  <div class="logo-wrap">
    <img id="logo-img" alt="GT 360°">
    <div class="brand-text">
      <div class="name">GT 360°</div>
      <div class="tag">Workspace de Gestão de Talentos</div>
    </div>
  </div>
  <div class="header-actions">
    <button type="button" onclick="baixarBackup()">Baixar backup</button>
    <button type="button" onclick="document.getElementById('backup-file').click()">Restaurar backup</button>
    <input id="backup-file" type="file" accept="application/json,.json" hidden onchange="restaurarBackup(event)">
    <span class="backup-status" id="backup-status" role="status" aria-live="polite"></span>
  </div>
</header>

<div class="workspace-body">
  <p class="mobile-nav-hint">Deslize o menu para ver os módulos →</p>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Navegação</div>
    <nav id="sidebar-nav" aria-label="Módulos do GT360°"></nav>
    <button class="side-toggle" id="side-toggle" onclick="toggleSidebar()" title="Recolher menu">
      <span class="label">Recolher</span><span class="chevron"></span>
    </button>
  </aside>

  <main class="content">
    <div class="boot" id="boot" role="status" aria-live="polite"><img id="boot-logo" alt="">Carregando workspace…</div>

    <div class="view home-view" id="home-view" inert aria-hidden="true">
      <div class="home-inner">
        <h1>Bem-vindo ao GT 360°</h1>
        <p>Escolha uma aplicação abaixo para começar a trabalhar.</p>
        <div id="home-grid"></div>
      </div>
    </div>

    <iframe class="view" id="frame-onboarding" title="Fluxo de Onboarding" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-avaliacao-clt" title="Avaliação de Experiência" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-avaliacao-pj" title="Avaliação de PJ" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-tempo-casa" title="Gestão de Tempo de Casa" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-desligamento" title="Questionário de Desligamento" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-engajamento" title="Pesquisa de Engajamento" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-riscos-psicossociais" title="Gestão de Riscos Psicossociais" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-treinamentos" title="Painel de Treinamentos" tabindex="-1" inert aria-hidden="true"></iframe>
    <iframe class="view" id="frame-checklist-5s" title="Checklist 5S" tabindex="-1" inert aria-hidden="true"></iframe>
  </main>
</div>

  'tempo-casa': 'modules/tempo-casa.html',
  'desligamento': 'modules/desligamento.html',
  'engajamento': 'modules/engajamento.html',
  'riscos-psicossociais': 'modules/riscos-psicossociais.html',
  'treinamentos': 'modules/treinamentos.html',
  'checklist-5s': 'modules/checklist-5s.html',
};

// Somente os registros dos módulos: outros projetos no mesmo domínio não entram no arquivo.
const BACKUP_KEYS = [
  'onb_colaboradores','onb_termosMap','onb_condutor',
  'clt_avaliacoes','pj_avaliacoes','tempoDeCasaDB_v1',
  'desl_respostas','desl_convites',
  'peo_blocos','peo_perguntas','peo_pessoas','peo_respostas','peo_lembretes','peo_config','peo_seed_version',
  'psicossocial_sistema_v1',
  'trn_treinamentos','trn_impactos','trn_questionarios','trn_inscricoes','trn_certmodelos','trn_turmas','trn_base_url',
  '5s_gt_state','5s_gt_meta','5s_gt_auditorias','5s_gt_agendamentos'
];

function baixarBackup(){
  const status=document.getElementById('backup-status');
  try{
    const entries={};
    BACKUP_KEYS.forEach(key=>{
      const value=localStorage.getItem(key);
      if(value!==null) entries[key]=value;
    });
    const content=JSON.stringify({format:'gt360-local-backup',version:1,createdAt:new Date().toISOString(),entries},null,2);
    const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));
    const link=document.createElement('a');
    link.href=url;
    link.download='gt360-backup-'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    status.textContent='Arquivo baixado. Guarde-o com cuidado: ele contém os dados registrados.';
  }catch(e){
    status.textContent='Não foi possível baixar o backup neste navegador.';
    console.error(e);
  }
}

async function restaurarBackup(event){
  const input=event.target;
  const file=input.files && input.files[0];
  input.value='';
  if(!file) return;
  const status=document.getElementById('backup-status');
  try{
    if(file.size>12*1024*1024) throw new Error('Arquivo muito grande para um backup local.');
    const backup=JSON.parse(await file.text());
    if(backup.format!=='gt360-local-backup'||backup.version!==1||!backup.entries||
       typeof backup.entries!=='object'||Array.isArray(backup.entries)){
      throw new Error('Formato de backup incompatível.');
    }
    const allowed=new Set(BACKUP_KEYS);
    for(const [key,value] of Object.entries(backup.entries)){
      if(!allowed.has(key)||typeof value!=='string') throw new Error('O arquivo contém dados não reconhecidos pelo GT360°.');
    }
    if(!confirm('Restaurar este arquivo? Os registros atuais dos módulos neste navegador serão substituídos.')) return;
    const previous={};
    BACKUP_KEYS.forEach(key=>{previous[key]=localStorage.getItem(key)});
    try{
      BACKUP_KEYS.forEach(key=>localStorage.removeItem(key));
      Object.entries(backup.entries).forEach(([key,value])=>localStorage.setItem(key,value));
    }catch(e){
      BACKUP_KEYS.forEach(key=>{
        try{if(previous[key]===null)localStorage.removeItem(key);else localStorage.setItem(key,previous[key])}catch(_){}
      });
      throw e;
    }
    location.reload();
  }catch(e){
    status.textContent=e.message||'Não foi possível restaurar o backup.';
    console.error(e);
  }
}

function montarSidebar(){
  const nav=document.getElementById('sidebar-nav');
  let html=`<button class="side-item" id="side-home" onclick="abrirApp('home')" title="Início"><span class="dot dhome"></span><span class="label">Início</span></button>
    <div class="sidebar-sep"></div>`;
  GROUPS_CONFIG.forEach(g=>{
    const itens=APPS_CONFIG.filter(a=>a.group===g.id);
    if(!itens.length) return;
    html+=`<div class="sidebar-label">${g.label}</div>`;
    itens.forEach(a=>{
      html+=`<button class="side-item" id="side-${a.id}" onclick="abrirApp('${a.id}')" title="${a.label}"><span class="dot ${g.dot}"></span><span class="label">${a.label}</span></button>`;
    });
  });
  nav.innerHTML=html;
}

function toggleSidebar(){
  const sidebar=document.getElementById('sidebar');
  const collapsed=sidebar.classList.toggle('collapsed');
  const btn=document.getElementById('side-toggle');
  if(btn){
    btn.title=collapsed?'Expandir menu':'Recolher menu';
    const lbl=btn.querySelector('.label');
    if(lbl) lbl.textContent=collapsed?'Expandir':'Recolher';
  }
  try{ localStorage.setItem('gt360_sidebar_collapsed', collapsed?'1':'0'); }catch(e){}
}

function montarHome(){
  const wrap=document.getElementById('home-grid');
  if(!APPS_CONFIG.length){
    wrap.innerHTML='<div class="home-empty">Nenhuma aplicação adicionada ao workspace ainda.</div>';
    return;
  }
  wrap.innerHTML=GROUPS_CONFIG.map(g=>{
    const itens=APPS_CONFIG.filter(a=>a.group===g.id);
    if(!itens.length) return '';
    return `<div class="home-group">
      <div class="home-group-label">${g.label}</div>
      <div class="home-grid">${itens.map(a=>`
        <div class="home-card">
          <div class="home-card-band ${g.dot}"></div>
          <div class="home-card-dot ${g.dot}"></div>
          <h3>${a.label}</h3>
          <p>${a.desc}</p>
          <button class="btn-acessar ${g.dot}" onclick="abrirApp('${a.id}')">Acessar aplicação</button>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

const carregados = new Set();

function carregarFrame(app, conviteHash=''){
  const frame = document.getElementById('frame-'+app);
  frame.src = APP_PATH[app] + conviteHash;
  carregados.add(app);
}

/* Cada módulo é carregado na primeira visita e permanece ativo ao alternar. */
function abrirApp(view, conviteHash=''){
  const home = document.getElementById('home-view');
  home.classList.toggle('active', view==='home');
  home.inert = view!=='home';
  home.setAttribute('aria-hidden', String(view!=='home'));
  apps.forEach(a=>{
    const ativo = a===view;
    const frame = document.getElementById('frame-'+a);
    frame.classList.toggle('active', ativo);
    frame.inert = !ativo;
    frame.tabIndex = ativo ? 0 : -1;
    frame.setAttribute('aria-hidden', String(!ativo));
  });
  const sideHome = document.getElementById('side-home');
  sideHome.classList.toggle('active', view==='home');
  sideHome.setAttribute('aria-current', view==='home' ? 'page' : 'false');
  apps.forEach(a=>{
    const item = document.getElementById('side-'+a);
    item.classList.toggle('active', a===view);
    item.setAttribute('aria-current', a===view ? 'page' : 'false');
  });
  const boot = document.getElementById('boot');
  if(boot) boot.style.display='none';

  if(view!=='home' && !carregados.has(view)){
    carregarFrame(view, conviteHash);
  }

  // Ao trocar de módulo, a seção que abre não deve herdar a posição de rolagem da anterior.
  if(view==='home'){
    document.getElementById('home-view').scrollTop=0;
  }else{
    const frame=document.getElementById('frame-'+view);
    try{ if(frame.contentWindow) frame.contentWindow.scrollTo(0,0); }catch(e){}
  }
  try{ sessionStorage.setItem('gt360_app_ativo', view); }catch(e){}
}

/* Decodifica o mesmo formato de link usado pelos módulos — o shell
   quem recebe o link quando alguém clica nele (o navegador abre a URL
   de nível mais alto, não um módulo específico). */
function decodificarEstadoShell(str){
  let b64 = str.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length % 4) b64 += '=';
  const utf8 = atob(b64);
  return JSON.parse(decodeURIComponent(escape(utf8)));
}
function appDoTipoConvite(tipo){
  if(tipo==='clt') return 'avaliacao-clt';
  if(tipo==='pj') return 'avaliacao-pj';
  if(tipo && tipo.indexOf('desligamento')===0) return 'desligamento';
  if(tipo && tipo.indexOf('5s')===0) return 'checklist-5s';
  return null;
}

window.addEventListener('load', ()=>{
  montarSidebar();
  montarHome();
  try{
    if(localStorage.getItem('gt360_sidebar_collapsed')==='1') toggleSidebar();
  }catch(e){}

  // O shell identifica o módulo e repassa o hash para o arquivo da aplicação.
  const hash = location.hash;
  if(hash.indexOf('#av=') === 0){
    try{
      const registro = decodificarEstadoShell(hash.slice(4));
      const app = appDoTipoConvite(registro.tipo);
      if(app){
        abrirApp(app, hash);
        return;
      }
    }catch(e){ console.warn('Link de convite inválido', e); }
  }

  // Links antigos das aplicações apontam para o módulo correspondente.
  const modulo = new URLSearchParams(location.search).get('modulo');
  abrirApp(apps.includes(modulo) ? modulo : 'home');
});
</script>
