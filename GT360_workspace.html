<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT 360° — Workspace de Gestão de Talentos</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
:root{
  --g1a:#f7a800;--g1b:#ff4e00;--g2a:#0099e5;--g2b:#00e5a0;--g3a:#7b2ff7;--g3b:#e0009e;
  --grad1:linear-gradient(160deg,var(--g1a),var(--g1b));
  --grad2:linear-gradient(160deg,var(--g2a),var(--g2b));
  --grad3:linear-gradient(160deg,var(--g3a),var(--g3b));
  --gradFull:linear-gradient(135deg,#f7a800 0%,#ff4e00 20%,#e0009e 40%,#7b2ff7 60%,#0099e5 80%,#00e5a0 100%);
  --white:#fff;--offwhite:#f8f9fc;
  --gray50:#f4f5f8;--gray100:#e8eaf0;--gray200:#d0d4e0;
  --gray400:#9098b0;--gray600:#5a6278;--gray800:#2a2f42;
  --shadow:0 2px 12px rgba(0,0,0,.08);--shadow-lg:0 8px 28px rgba(20,20,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--offwhite);color:var(--gray800);font-family:'Sora',sans-serif;display:flex;flex-direction:column;overflow:hidden}

.brand-band{height:5px;background:var(--gradFull);flex-shrink:0}

header{background:var(--white);box-shadow:var(--shadow);display:flex;align-items:center;gap:18px;padding:12px 24px;flex-shrink:0;position:relative;z-index:50}
.logo-wrap{display:flex;align-items:center;gap:12px}
.logo-wrap img{height:44px;width:auto;display:block}
.brand-text{display:flex;flex-direction:column;line-height:1.1}
.brand-text .name{font-family:'DM Serif Display',serif;font-size:20px;letter-spacing:.02em;color:var(--gray800)}
.brand-text .tag{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--gray400);font-weight:600;margin-top:2px}

/* WORKSPACE BODY (sidebar + conteudo) */
.workspace-body{flex:1;display:flex;overflow:hidden;min-height:0}

.sidebar{width:248px;flex-shrink:0;background:var(--white);border-right:1px solid var(--gray100);display:flex;flex-direction:column;padding:18px 12px;gap:2px;overflow-y:auto;overflow-x:hidden;transition:width .2s ease}
.sidebar.collapsed{width:76px}
.sidebar.collapsed .sidebar-label{display:none}
.sidebar.collapsed .side-item{justify-content:center;padding:12px 8px}
.sidebar.collapsed .side-item .label{display:none}
.sidebar.collapsed .side-toggle{justify-content:center}
.sidebar.collapsed .side-toggle .chevron{transform:rotate(180deg)}
.sidebar-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--gray400);padding:6px 12px 10px}
.side-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--gray600);transition:all .18s;border:2px solid transparent;background:none;text-align:left;width:100%;font-family:'Sora',sans-serif}
.side-item:hover{background:var(--gray50);color:var(--gray800)}
.side-item.active{background:var(--gray800);border-color:var(--gray800);color:var(--white)}
.side-item .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.side-item .dot.dhome{background:var(--gray800)}
.side-item .dot.d1{background:var(--grad1)}
.side-item .dot.d2{background:var(--grad2)}
.side-item .dot.d3{background:var(--grad3)}
.side-item.active .dot{box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.sidebar-sep{height:1px;background:var(--gray100);margin:10px 8px}
.side-toggle{margin-top:auto;display:flex;align-items:center;justify-content:flex-end;gap:8px;width:100%;padding:12px 14px;border-radius:10px;border:none;background:none;cursor:pointer;color:var(--gray400);font-family:'Sora',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:background .18s,color .18s}
.side-toggle:hover{background:var(--gray50);color:var(--gray800)}
.side-toggle .chevron{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-right:6px solid currentColor;flex-shrink:0;transition:transform .2s}
.sidebar.collapsed .side-toggle .label{display:none}

/* CONTEUDO */
.content{flex:1;position:relative;overflow:hidden;min-width:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .15s}
.view.active{opacity:1;pointer-events:auto}
iframe.view{width:100%;height:100%;border:0;background:var(--white)}

.boot{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--gray400);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;z-index:40;background:var(--offwhite)}
.boot img{height:56px;opacity:.5}

/* HOME */
.home-view{overflow-y:auto;background:var(--offwhite)}
.home-inner{max-width:960px;margin:0 auto;padding:56px 24px 60px}
.home-inner h1{font-family:'DM Serif Display',serif;font-size:32px;color:var(--gray800);margin-bottom:10px}
.home-inner>p{font-size:14px;color:var(--gray400);margin-bottom:32px;max-width:560px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.home-card{background:var(--white);border-radius:var(--radius,12px);box-shadow:var(--shadow);padding:24px;position:relative;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.home-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.home-card-band{position:absolute;top:0;left:0;right:0;height:5px}
.home-card-band.d1{background:var(--grad1)}
.home-card-band.d2{background:var(--grad2)}
.home-card-band.d3{background:var(--grad3)}
.home-card-dot{width:34px;height:34px;border-radius:10px;margin:6px 0 14px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.home-card-dot.d1{background:var(--grad1)}
.home-card-dot.d2{background:var(--grad2)}
.home-card-dot.d3{background:var(--grad3)}
.home-card h3{font-size:15px;font-weight:700;color:var(--gray800);margin-bottom:8px}
.home-card p{font-size:12.5px;color:var(--gray400);line-height:1.5;margin-bottom:18px;flex:1}
.btn-acessar{align-self:flex-start;padding:10px 20px;border-radius:10px;border:none;background:var(--grad2);color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;cursor:pointer;transition:opacity .2s,transform .2s}
.btn-acessar:hover{opacity:.9;transform:translateY(-1px)}
.home-empty{color:var(--gray400);font-size:13px;padding:24px;text-align:center}

@media (max-width:780px){
  header{padding:10px 14px;gap:10px}
  .brand-text .name{font-size:16px}
  .brand-text .tag{display:none}
  .workspace-body{flex-direction:column}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:none;border-bottom:1px solid var(--gray100);padding:8px 10px;gap:6px}
  .sidebar-label{display:none}
  .sidebar-sep{display:none}
  .side-item{flex-shrink:0;white-space:nowrap}
  .side-toggle{display:none}
  .sidebar.collapsed{width:100%}
  .home-inner{padding:32px 16px 40px}
  .home-inner h1{font-size:24px}
}
</style>
</head>
<body>

<div class="brand-band"></div>
<header>
  <div class="logo-wrap">
    <img id="logo-img" alt="GT 360°">
    <div class="brand-text">
      <div class="name">GT 360°</div>
      <div class="tag">Workspace de Gestão de Talentos</div>
    </div>
  </div>

</header>

<div class="workspace-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-label">Navegação</div>
    <nav id="sidebar-nav"></nav>
    <button class="side-toggle" id="side-toggle" onclick="toggleSidebar()" title="Recolher menu">
      <span class="label">Recolher</span><span class="chevron"></span>
    </button>
  </aside>

  <main class="content">
    <div class="boot" id="boot"><img id="boot-logo" alt="">Carregando workspace…</div>

    <div class="view home-view" id="home-view">
      <div class="home-inner">
        <h1>Bem-vindo ao GT 360°</h1>
        <p>Escolha uma aplicação abaixo para começar a trabalhar.</p>
        <div class="home-grid" id="home-grid"></div>
      </div>
    </div>

    <iframe class="view" id="frame-onboarding" title="Fluxo de Onboarding"></iframe>
    <iframe class="view" id="frame-treinamentos" title="Painel de Treinamentos"></iframe>
  </main>
</div>

function b64ToUtf8(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

const ONBOARDING_HTML = b64ToUtf8(ONBOARDING_B64);
const TREINAMENTOS_HTML = b64ToUtf8(TREINAMENTOS_B64);

function montarSidebar(){
  const nav=document.getElementById('sidebar-nav');
  let html=`<button class="side-item" id="side-home" onclick="abrirApp('home')" title="Início"><span class="dot dhome"></span><span class="label">Início</span></button>

  });
  nav.innerHTML=html;
}

  if(btn){
    btn.title=collapsed?'Expandir menu':'Recolher menu';
    const lbl=btn.querySelector('.label');
    if(lbl) lbl.textContent=collapsed?'Expandir':'Recolher';
  }
  try{ localStorage.setItem('gt360_sidebar_collapsed', collapsed?'1':'0'); }catch(e){}
}

function montarHome(){
  const grid=document.getElementById('home-grid');
  if(!APPS_CONFIG.length){
    grid.innerHTML='<div class="home-empty">Nenhuma aplicação adicionada ao workspace ainda.</div>';
    return;
  }
  grid.innerHTML=APPS_CONFIG.map(a=>`
    <div class="home-card">
      <div class="home-card-band ${a.dot}"></div>
      <div class="home-card-dot ${a.dot}"></div>
      <h3>${a.label}</h3>
      <p>${a.desc}</p>
      <button class="btn-acessar" onclick="abrirApp('${a.id}')">Acessar aplicação</button>
    </div>`).join('');
}

function carregarFrame(app){
  const frame = document.getElementById('frame-'+app);
  frame.srcdoc = '';
  requestAnimationFrame(()=>{ frame.srcdoc = APP_HTML[app]; });
}

function abrirApp(view){
  document.getElementById('home-view').classList.toggle('active', view==='home');
  apps.forEach(a=>{
    document.getElementById('frame-'+a).classList.toggle('active', a===view);
  });
  document.getElementById('side-home').classList.toggle('active', view==='home');
  apps.forEach(a=>document.getElementById('side-'+a).classList.toggle('active', a===view));
  const boot = document.getElementById('boot');
  if(boot) boot.style.display='none';
  // Ao trocar de módulo, a seção que abre não deve herdar a posição de rolagem da anterior.
  if(view==='home'){
    document.getElementById('home-view').scrollTop=0;
  }else{
    const frame=document.getElementById('frame-'+view);
    try{ if(frame.contentWindow) frame.contentWindow.scrollTo(0,0); }catch(e){}
  }
  try{ sessionStorage.setItem('gt360_app_ativo', view); }catch(e){}
}

window.addEventListener('load', ()=>{
  montarSidebar();
  montarHome();
  apps.forEach(carregarFrame);
  try{
    if(localStorage.getItem('gt360_sidebar_collapsed')==='1') toggleSidebar();
  }catch(e){}
  // O workspace sempre abre pela página inicial — o acesso a cada aplicação
  // é feito por um botão explícito ("Acessar aplicação"), sem necessidade de login.
  abrirApp('home');
});
</script>
